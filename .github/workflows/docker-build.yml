name: Docker Image CI

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and publish"
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  buildx:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}

    steps:
      -
        name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      -
        name: Login to container registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_TOKEN }}
          registry: ghcr.io
      -
        name: Build and Push arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          tags: ghcr.io/tech1ndex/notifier:${{ env.TAG }}-arm64
          platforms: linux/arm64
          push: true
      -
         name: Build and Push amd64
         uses: docker/build-push-action@v7
         with:
          context: .
          tags: ghcr.io/tech1ndex/notifier:${{ env.TAG }}-amd64
          platforms: linux/amd64
          push: true
      -
        name: Create and Push manifest
        run: |
          docker buildx imagetools create -t ghcr.io/tech1ndex/notifier:latest \
            ghcr.io/tech1ndex/notifier:${TAG}-amd64 \
            ghcr.io/tech1ndex/notifier:${TAG}-arm64
